<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pull Requests</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <div id="error" class="banner error" role="alert" hidden></div>
  <div id="orgs" class="banner" hidden></div>
  <div id="warning" class="banner" role="status" hidden></div>
  <div id="empty" hidden>
    <div class="hero">
      <span class="hero-icon" aria-hidden="true">⌘</span>
      <h1>Your pull requests, live.</h1>
      <p>Sign in to GitHub in this Chrome profile. Your pull requests will appear here automatically.</p>
      <button id="signin" class="primary">Open GitHub</button>
      <button id="retry" class="text-button">Already signed in? Refresh</button>
    </div>
  </div>
  <div id="app">
    <div id="toolbar">
      <input id="filter" type="search" placeholder="Search pull requests…" aria-label="Search pull requests" />
      <select id="range" aria-label="Updated within"></select>
      <button id="close-search" class="icon-btn" aria-label="Clear search" title="Clear search">×</button>
    </div>
    <main id="folders" aria-label="GitHub live folders"></main>
  </div>
  <footer>
    <button id="account" class="account" title="Open GitHub"><img id="avatar" alt="" hidden /><span id="status">Connecting to GitHub…</span></button>
    <button id="search" class="icon-btn" title="Search (/)" aria-label="Search"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg></button>
    <button id="refresh" class="icon-btn" title="Refresh (R)" aria-label="Refresh"><svg viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3"/></svg></button>
    <button id="settings" class="icon-btn" title="Settings" aria-label="Settings"><svg viewBox="0 0 16 16"><path d="M3 4h10M3 8h10M3 12h10"/><circle cx="6" cy="4" r="1.5"/><circle cx="10" cy="8" r="1.5"/><circle cx="6" cy="12" r="1.5"/></svg></button>
  </footer>
  <div id="menu" role="menu" hidden></div>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
